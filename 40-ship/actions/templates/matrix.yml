# 矩阵构建模板：一次并行跑多个版本组合，适合测试/多平台打包。
name: 矩阵构建

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # 一个失败不影响其他组合
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, windows-latest]   # macOS 计费 10×，白嫖慎用
        python: ["3.10", "3.12"]
        exclude:
          - os: windows-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 跑测试
        run: |
          python -m pip install -U pip
          python -m pytest -q || python -c "print('TODO: 换成你的测试命令')"
