# 每周自动体检所有外链，把结果提交回 docs/link-check.md。
# 这是本仓库自己的"定时任务"示例：不需要服务器，GitHub 免费跑。
name: 外链体检

on:
  schedule:
    - cron: "0 1 * * 1"   # 每周一 UTC 01:00（北京时间 09:00）
  workflow_dispatch:
  push:
    paths:
      - "**/*.md"
      - "scripts/verify_links.py"
      - ".github/workflows/link-check.yml"

permissions:
  contents: write

concurrency:
  group: link-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 体检
        run: python scripts/verify_links.py

      - name: 提交报告
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/link-check.md
          if git diff --cached --quiet; then
            echo "外链无变化"
          else
            git commit -m "chore(link-check): 更新外链体检报告 [skip ci]"
            git push
          fi
