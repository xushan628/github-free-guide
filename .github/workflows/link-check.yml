# 每周自动体检所有外链 + 同步 10-resources/datasets 的数据集目录，把结果提交回仓库。
# 这是本仓库自己的"定时任务"示例：不需要服务器，GitHub 免费跑。
name: 外链体检

on:
  schedule:
    - cron: "0 1 * * 1"   # 每周一 UTC 01:00（北京时间 09:00）
  workflow_dispatch:
  push:
    paths:
      - "**/*.md"
      - "scripts/verify_links.py"
      - ".github/workflows/link-check.yml"

permissions:
  contents: write

concurrency:
  group: link-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 体检
        env:
          # 用内置 token 提升 API 速率上限（未认证 60 次/小时，认证 5000 次/小时）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify_links.py

      - name: 同步开源数据集目录
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_atlas.py

      - name: 提交报告
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/link-check.md 10-resources/datasets/
          if git diff --cached --quiet; then
            echo "外链与数据集目录均无变化"
          else
            git commit -m "chore(link-check): 更新外链体检报告与数据集目录 [skip ci]"
            git push
          fi
